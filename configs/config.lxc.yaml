server:
  listen: "0.0.0.0:8080"
  tls_cert_file: "/etc/stumpfworks-badge/tls/server.crt"
  tls_key_file: "/etc/stumpfworks-badge/tls/server.key"

client_api:
  # Keep disabled until the device-certificate rollout has its own rollback.
  enabled: false
  listen: "0.0.0.0:8444"
  enrollment_enabled: false
  enrollment_listen: "0.0.0.0:8445"
  ca_file: "/etc/stumpfworks-badge/device-ca/ca.crt"
  ca_key_file: "/etc/stumpfworks-badge/device-ca/ca.key"

database:
  path: "/var/lib/stumpfworks-badge/badges.db"

# Deployment template. Copy to an ignored local file and replace every example value.
directory:
  enabled: true
  # Keep disabled until DC01 presents a CA-trusted certificate with a matching DNS SAN.
  framework_read_enabled: false
  url: "ldaps://dc01.example.test:636"
  base_dn: "DC=example,DC=test"
  bind_dn: "svc-swbadge@example.test"
  bind_password: ""
  bind_password_file: "/etc/stumpfworks-badge/ldap-password"
  domain: "example.test"
  admin_group_dn: "CN=SWBadge-Admins,CN=Users,DC=example,DC=test"
  identity_operator_group_dn: ""
  oidc_operator_group_dn: ""
  client_operator_group_dn: ""
  identity_auditor_group_dn: ""
  # Legacy adapter only; the framework reader never accepts this SAN bypass.
  ca_file: ""
  cert_sha256: ""

auth:
  # Keep the real secret in the service environment, never in Git.
  session_secret: ""
  session_secret_file: "/etc/stumpfworks-badge/session-secret"

metrics:
  enabled: false
  token_file: "/etc/stumpfworks-badge/metrics-token"
  backup_path: "/var/backups/stumpfworks-badge/latest.db"
  maintenance_file: "/run/stumpfworks-badge/maintenance"

pkinit:
  enabled: true
  ca_cert_file: "/etc/stumpfworks-badge/pkinit-ca/ca.crt"
  ca_key_file: "/etc/stumpfworks-badge/pkinit-ca/ca.key"
  realm: "EXAMPLE.TEST"

emergency_admin:
  # Disabled by default. Enable only with the documented root-issued token procedure.
  enabled: false
