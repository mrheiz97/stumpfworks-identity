name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  ad-profile-samba:
    name: Samba guards and fixture rollback (CAS gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build isolated test binary
        run: |
          mkdir -p /tmp/ad-profile-tests
          CGO_ENABLED=0 go test -c -o /tmp/ad-profile-tests/adprofile.test ./internal/adprofile
          CGO_ENABLED=0 go build -o /tmp/ad-profile-tests/executor ./cmd/ad-profile-executor
      - name: Build disposable Samba image
        run: docker build -t identity-ad-profile-lab:ci scripts/ad-profile-lab
      - name: Test without network or host ports
        run: |
          docker run --rm --network none --hostname dc1 \
            --mount type=bind,source="$PWD/scripts/ad-profile-lab",target=/workspace/scripts/ad-profile-lab,readonly \
            --mount type=bind,source=/tmp/ad-profile-tests,target=/workspace/dist/ad-profile-tests,readonly \
            --entrypoint sh identity-ad-profile-lab:ci /workspace/scripts/ad-profile-lab/run.sh
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: identity-ci-fixture
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55441:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: PostgreSQL backup tools
        run: |
          if ! command -v pg_dump >/dev/null || ! command -v pg_restore >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          echo "IDENTITY_TEST_PG_DUMP=$(command -v pg_dump)" >> "$GITHUB_ENV"
          echo "IDENTITY_TEST_PG_RESTORE=$(command -v pg_restore)" >> "$GITHUB_ENV"
      - name: Prometheus tooling
        run: |
          if ! command -v promtool >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends prometheus
          fi
          sudo install -d -m 0700 /etc/prometheus/secrets /etc/prometheus/pki
          printf '%s\n' 'ci-placeholder-not-a-secret' | sudo tee /etc/prometheus/secrets/identity-metrics-token >/dev/null
          sudo chown -R "$(id -u):$(id -g)" /etc/prometheus/secrets /etc/prometheus/pki
          chmod 0600 /etc/prometheus/secrets/identity-metrics-token
          sudo cp /etc/ssl/certs/ca-certificates.crt /etc/prometheus/pki/stumpfworks-homelab-ca.crt
          promtool check config deploy/prometheus/identity-scrape.yml
          promtool check rules deploy/prometheus/identity-rules.yml
      - name: Go tests
        env:
          # Synthetic service credentials, never production credentials.
          IDENTITY_TEST_POSTGRES_URL: postgres://postgres:identity-ci-fixture@127.0.0.1:55441/postgres?sslmode=disable
        run: go test -race ./...
      - name: Python syntax
        run: |
          python3 -m py_compile cmd/native-greeter/sw-badge-native-greeter.py
          python3 -m py_compile scripts/swbadge-sqlite-backup.py scripts/swbadge-postgres-backup.py
          python3 -m py_compile scripts/prepare-wyse01-update-worker.py
          python3 -m py_compile scripts/ad-profile-lab/provision.py scripts/ad-profile-lab/broker_candidate.py scripts/ad-profile-lab/broker_research.py scripts/ad-profile-lab/broker_envelope.py scripts/ad-profile-lab/broker_boundary_research.py
      - name: VNC password helper permission contract
        run: sudo python3 scripts/test-vnc-password-helper.py
      - name: Update catalog permission contract
        run: sudo python3 scripts/test-update-catalog-permissions.py
      - name: Scheduled update unit validation
        run: |
          mkdir -p /tmp/identity-unit-check
          cp deploy/systemd/swbadge-client-updates.service deploy/systemd/swbadge-client-updates.timer /tmp/identity-unit-check/
          # The release binary is not installed in CI. Ignore only the missing
          # executable; retain all real unit directives and dependency checks.
          sed -i 's|^ExecStart=/usr/local/sbin/sw-badge-client-update-worker$|ExecStart=/usr/bin/true|' /tmp/identity-unit-check/swbadge-client-updates.service
          systemd-analyze verify /tmp/identity-unit-check/swbadge-client-updates.service /tmp/identity-unit-check/swbadge-client-updates.timer
      - name: Shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n
      - name: Whitespace
        run: git diff --check
