scrape_configs:
  - job_name: stumpfworks-identity
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/identity-metrics-token
    tls_config:
      ca_file: /etc/prometheus/pki/stumpfworks-homelab-ca.crt
      server_name: login01.example.test
    static_configs:
      - targets: ["login01.example.test:8080"]
    scrape_interval: 30s
    scrape_timeout: 5s
rule_files:
  - deploy/prometheus/identity-rules.yml
