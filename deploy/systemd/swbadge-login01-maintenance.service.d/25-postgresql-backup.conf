[Service]
# Replace the SQLite backup after a completed PostgreSQL cutover. Clearing the
# inherited list also prevents the success marker from advancing before the
# PostgreSQL custom-format dump has been verified by pg_restore --list.
ExecStart=
ExecStart=/usr/local/sbin/swbadge-cert-check 2592000 /etc/stumpfworks-badge/tls/server.crt /etc/stumpfworks-badge/tls/ca.crt /etc/stumpfworks-badge/pkinit-ca/ca.crt
ExecStart=/usr/local/sbin/swbadge-postgres-backup /etc/stumpfworks-badge/postgres-backup-service.conf /var/backups/stumpfworks-badge-postgresql
ExecStart=/usr/bin/touch /var/lib/stumpfworks-badge/last-successful-backup
ReadWritePaths=/var/backups/stumpfworks-badge-postgresql /var/lib/stumpfworks-badge
